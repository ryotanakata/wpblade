name: CI

on:
  push:
    branches: [master]
  pull_request:

# テストフレームワークは同梱しない方針のため（README 参照）、
# CI は「配布物が型エラー・フォーマット崩れなしで公開されていること」だけを保証する。
jobs:
  frontend:
    name: typecheck / format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wp-content/themes/wpblade

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: wp-content/themes/wpblade/.nvmrc
          cache: npm
          cache-dependency-path: wp-content/themes/wpblade/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check
